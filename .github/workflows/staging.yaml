name: Bootstrap ArgoCD
on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging
  workflow_dispatch:    
permissions:
  id-token: write
  contents: read

jobs:
  install-argocd:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repo
        uses: actions/checkout@v3

      - name: Azure login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          # client-secret: ${{secrets.AZURE_CLIENT_SECRET}}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group ${{secrets.RESOURCE_GROUP}} --name ${{secrets.CLUSTER_NAME}}

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install the ingress-controller
        run: |
          helm upgrade --install ingress-nginx ingress-nginx --repo https://kubernetes.github.io/ingress-nginx --namespace shortner --create-namespace

      - name: Install rabbitMq cluster operater
        run: |
            kubectl apply -f https://github.com/rabbitmq/cluster-operator/releases/latest/download/cluster-operator.yml -n shortner

      - name: Install nats cluster
        run: |
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/
          helm upgrade --install nats nats/nats -n shortner

      - name: Install ArgoCD and Add gitops to ArgoCD
        run: |
          export DOCKER_USERNAME=${{secrets.DOCKER_USERNAME}}
          export TOKEN=${{secrets.TOKEN}}
          export ARGOCD_PASSWORD=${{secrets.ARGOCD_ADMIN_PASSWORD}}
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          if ! helm status argocd -n argocd >/dev/null 2>&1; then
          helm install argocd argo/argo-cd --namespace argocd --create-namespace
          else
          echo "ArgoCD already installed in namespace argocd"
          fi

      # - name: Wait for ArgoCD pods
      #   run: kubectl wait --for=condition=available --timeout=300s deployment -n argocd --all

  Deploy :
    environment: staging
    needs: install-argocd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repo
        uses: actions/checkout@v3

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Azure login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          # client-secret: ${{secrets.AZURE_CLIENT_SECRET}}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group ${{secrets.RESOURCE_GROUP}} --name ${{secrets.CLUSTER_NAME}}


      - name: Install ArgoCD CLI and agrocd
        run: |
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.1.9/manifests/ha/install.yaml
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/

      # - name : Add metric argocd-server
      #   run : |
      #        helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
      #        helm upgrade --install metrics-server metrics-server/metrics-server --namespace kube-system \
      #        --set image.repository=registry.k8s.io/metrics-server/metrics-server \
      #        --set image.tag=v0.7.2 \
      #        --set "args={--kubelet-insecure-tls,--kubelet-preferred-address-types=InternalIP,ExternalIP,Hostname}"

      - name: ArgoCD login
        run: |
          export ARGOCD_ADMIN_PASSWORD=$(printf "%s" "${{secrets.ARGOCD_ADMIN_PASSWORD}}" | htpasswd -Bn -i -)
          export GITOPS_URL=${{secrets.GITOPS_URL}}
          export DOCKER_USERNAME=${{secrets.DOCKER_USERNAME}}
          export TOKEN=${{secrets.TOKEN}}

          kubectl patch secret argocd-secret -n argocd -p '{"data": {"admin.password": null, "admin.passwordMtime": null}}'

          kubectl rollout restart deployment argocd-server -n argocd
          kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d

          kubectl port-forward svc/argocd-server -n argocd 8080:443 &  sleep 5

          export ARGOCD_OPTS='--port-forward-namespace argocd'

          ARGOCD_NAMESPACE="argocd"

          INITIAL_PASSWORD=$(kubectl -n "$ARGOCD_NAMESPACE" get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d)

          argocd login localhost:8080 --insecure --username admin --password $INITIAL_PASSWORD

          argocd repo add  $GITOPS_URL \
            --username $DOCKER_USERNAME \
            --password $TOKEN --upsert


      - name : pull application.yaml file
        run: |
          export BRANCH=${{secrets.BRANCH}}
          export MANIFEST_REPO=${{secrets.MANIFEST_REPO}}
          export TOKEN=${{secrets.TOKEN}}
          export DOCKER_USERNAME=${{secrets.DOCKER_USERNAME}}

          sudo apt-get update && sudo apt-get install -y git
          mkdir -p ~/argocd
          git clone --branch $BRANCH https://$TOKEN@github.com/$DOCKER_USERNAME/$MANIFEST_REPO.git  ~/argocd


      - name: kubectl apply run applications
        run: |
          cd  ~/argocd

          kubectl apply -f manifest/secrets.application.yaml -n argocd
          kubectl apply -f  project/secrets.yaml -n argocd
          # wait for sealed-secret-controller to properly decrept the secret
          sleep 30

          kubectl apply -f  manifest/ingress.application.yaml -n argocd
          kubectl apply -f  manifest/rabbitmq.application.yaml -n argocd
          kubectl apply -f  manifest/nats.application.yaml -n argocd
          kubectl apply -f  manifest/web.application.yaml -n argocd
          kubectl apply -f  manifest/api.application.yaml -n argocd
          kubectl apply -f  manifest/analytics.application.yaml -n argocd
          kubectl apply -f  manifest/ws.application.yaml -n argocd
          kubectl apply -f  manifest/web.application.yaml -n argocd
          kubectl apply -f  manifest/collecter.application.yaml -n argocd
          kubectl apply -f  manifest/converter.application.yaml -n argocd

          kubectl apply -f  project/ingress.yaml -n argocd
          kubectl apply -f  project/nats.yaml -n argocd
          kubectl apply -f  project/rabbitmq.yaml -n argocd
          kubectl apply -f  project/shortner-analytics.yaml -n argocd
          kubectl apply -f  project/shortner-api.yaml -n argocd
          kubectl apply -f  project/shortner-collector.yaml -n argocd
          kubectl apply -f  project/shortner-web.yaml -n argocd
          kubectl apply -f  project/shortner-ws.yaml -n argocd
          kubectl apply -f  project/shortner.yaml -n argocd






